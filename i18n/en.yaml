# Top toolbar — the app's real actions, always visible. They used to live
# only in the system menu, which is why the app didn't explain itself:
# a first-time user saw an empty grid and no buttons at all.
barra:
  adicionar: "Add files"
  adicionar_dica: "Pick a folder or files to copy into the project. You can also drag straight from Finder onto anywhere in this window."
  buscar: "Search by name, code or any detail"
  tamanho_dica: "Thumbnail size"
  detalhes_dica: "Shows or hides the side panel with the details of whatever is selected."
  backup: Backup
  backup_dica: "Copies the original byte for byte to another drive, following the folders you built under BACKUP. The source is never touched."
  contagem: "{visiveis} of {total} files"
  contagem_filtrada: "{visiveis} of {total} files  ·  filtered"

# Guidance strip: says, in one sentence, what to do NOW. Changes with the
# state of the project and can be dismissed — this is the direct answer to
# "the software doesn't explain itself".
guia:
  vazio_titulo: "Start by dragging your files here"
  vazio_corpo: "A whole drive, a folder, or loose files. Nothing is moved or deleted: Matriz copies them into the project and builds the view."
  classificar_titulo: "{n} file(s) still have no category"
  classificar_corpo: "Select several (click one, then Shift+click another) and use \"Batch edit\" to give them a category and details all at once."
  organizar_titulo: "Now lay out the backup"
  organizar_corpo: "Open the BACKUP tab on the left, make folders with \"+\", and drag folders or files from EXPLORER into them."
  backup_titulo: "Ready to write the backup"
  backup_corpo: "Click Backup and pick the destination drive. Matriz writes everything in the layout you built."
  ocultar: "Got it"
  mostrar: Tip

