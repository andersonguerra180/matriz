tipo: sample
rotulo: Sample
modos: [archive, catalog]
ordem: 130
icone: audio
grupos:
  - rotulo: Classificação
    campos:
      - id: origem
        rotulo: Origem
        tipo: opcao
        opcoes: [Digital, Analógico]
        obrigatorio: true
        preenchido_por: leitura_tecnica
      - id: ano
        rotulo: Ano
        tipo: inteiro
      - id: categoria
        rotulo: Categoria
        tipo: opcao
        opcoes: [kick, snare, hat, perc, bass, lead, pad, vocal, fx, loop, one-shot]
        sugerido_por: clip_audio
      - id: bpm
        rotulo: BPM
        tipo: numero
        preenchido_por: detector_bpm
      - id: tonalidade
        rotulo: Tonalidade
        tipo: opcao
        opcoes: [C, "C#", D, "D#", E, F, "F#", G, "G#", A, "A#", B]
        preenchido_por: detector_tonalidade
      - id: tipo_temporal
        rotulo: Tipo temporal
        tipo: opcao
        opcoes: [one-shot, loop]
        preenchido_por: leitura_tecnica
  - rotulo: Direitos e origem
    campos:
      - id: licenca
        rotulo: Licença
        tipo: opcao
        opcoes: ["royalty-free", exclusiva, "sample clearance pendente", "uso interno"]
        obrigatorio: true
      - id: origem_texto
        rotulo: Origem
        tipo: texto
