tipo: cassete
rotulo: Cassete
modos: [archive]
ordem: 10
icone: audio
grupos:
  - rotulo: Suporte
    campos:
      - id: origem
        rotulo: Origem
        tipo: opcao
        opcoes: [Digital, Analógico]
        obrigatorio: true
        preenchido_por: leitura_tecnica
      - id: ano
        rotulo: Ano
        tipo: inteiro
      - id: tipo_fita
        rotulo: Tipo de fita
        tipo: opcao
        opcoes: ["I (normal/ferro)", "II (cromo)", "III (ferrocromo)", "IV (metal)"]
        obrigatorio: true
      - id: marca
        rotulo: Marca
        tipo: opcao_livre
        # opcao_livre JÁ aceita texto digitado — "Other" está na lista pra
        # tornar essa saída descoberta, não só possível. O que for digitado
        # entra no vocabulário do projeto (ProjetoAberto::valoresUsadosNoCampo).
        opcoes: [Ampex, BASF, Scotch, Quantegy, ATR, Other]
      - id: duracao_nominal
        rotulo: Duração nominal
        tipo: opcao
        opcoes: [C46, C60, C90, C120]
  - rotulo: Abrangência
    campos:
      - id: abrangencia
        rotulo: Abrangência da gravação
        tipo: opcao
        opcoes: ["fita inteira", "trecho da fita"]
        obrigatorio: true
      - id: trecho_posicao
        rotulo: Posição do trecho
        tipo: texto
        visivel_se: "abrangencia == trecho da fita"
      - id: trecho_observacao
        rotulo: Observação sobre o trecho
        tipo: texto
        visivel_se: "abrangencia == trecho da fita"
  - rotulo: Reprodução
    campos:
      - id: dolby
        rotulo: Redução de ruído
        tipo: opcao
        opcoes: [nenhum, "Dolby B", "Dolby C", "Dolby S"]
        obrigatorio: true
      - id: direcao
        rotulo: Sentido capturado
        tipo: opcao
        opcoes: ["lado A", "lado B", "autoreverse (A+B)"]
        obrigatorio: true
      - id: deck
        rotulo: Deck de reprodução
        tipo: texto
  - rotulo: Estado físico
    campos:
      - id: sticky_shed
        rotulo: Sinais de sticky shed
        tipo: booleano
        alerta_se_true: "Requer tratamento térmico antes da reprodução"
      - id: fita_solta_enroscada
        rotulo: Fita solta ou enroscada no mecanismo
        tipo: booleano
      - id: estado_geral
        rotulo: Estado geral
        tipo: opcao
        opcoes: [bom, regular, frágil, crítico]
  - rotulo: Conteúdo
    campos:
      - id: natureza
        rotulo: Natureza do conteúdo
        tipo: opcao
        opcoes: [fala, música, ambiente, ritual, misto, tons de teste]
        sugerido_por: classificador_fala_musica
        afeta: [habilitar_transcricao]
      - id: idioma
        rotulo: Idioma
        tipo: opcao_livre
        visivel_se: "natureza in [fala, misto]"
